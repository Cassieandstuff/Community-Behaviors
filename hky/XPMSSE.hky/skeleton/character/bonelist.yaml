# Added-bone order for this skeleton layer, in the SOURCE skeleton's native bone order.
# Vanilla HKX-target animations resolve bone tracks by INDEX, so the appended bones must
# land at the same indices the source skeleton uses or every track maps to the wrong bone.
# Re-posed existing bones are NOT listed here — they replace the base master's bone in place
# and keep its index. (BR-native animations resolve by name and don't need this list.)
index:
  - "NPC L Item01"
  - "NPC L Item02"
  - "NPC L Item03"
  - "NPC R Item01"
  - "NPC R Item02"
  - "NPC R Item03"
  - "LeftWing1"
  - "LeftWing2"
  - "LeftWing3"
  - "LeftWing4"
  - "LeftWing5"
  - "RightWing1"
  - "RightWing2"
  - "RightWing3"
  - "RightWing4"
  - "RightWing5"
  - "Belly"
  - "NPC Anus Deep1"
  - "NPC RB Anus1"
  - "NPC LB Anus1"
  - "NPC LT Anus1"
  - "NPC RT Anus1"
  - "NPC Anus Deep2"
  - "NPC RB Anus2"
  - "NPC LB Anus2"
  - "NPC LT Anus2"
  - "NPC RT Anus2"
