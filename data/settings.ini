; ============================================================================
; Community Behaviors - settings.ini
; ============================================================================
; Shipped from the CB repo (data/settings.ini). Every build deploys this file
; over the copy in the mod, so the game always runs the settings the repo
; says. Change settings in the repo: an edit in the mod, or the in-game config
; menu's Save, lasts only until the next build.
; ============================================================================

[Cache]

; Behavior Relay compiles the merged behavior graphs into an on-disk cache the
; first time it runs, then reuses that cache on later game starts so startup is
; fast (the compile is skipped when a completed cache is already present).
;
; bForceRegenerate = true forces a FULL recompile on every game start instead of
; reusing the cache. Turn it on while iterating on your behavior mods / the
; converter output, so a stale cache can never mask your changes.
;
; Default (this key left commented / absent):
;   - Release builds: false  -> reuse an existing cache (fast start).
;   - Debug builds:   true   -> always regenerate.
; Uncomment and set explicitly to override the build default in either direction.
;
; NOTE (current limitation): the reuse check is presence-only - it does NOT yet
; detect a changed load order. If you add/remove/update behavior mods and are on
; a release build, either set bForceRegenerate=true for one launch, or delete the
; cache (the behavior_relay_cache folders + Data\behavior_relay\cache.ready) to
; force a rebuild. Content-fingerprint auto-invalidation is planned.
;
bForceRegenerate = true


[Compiler]
bUseSchema = true


[Debug]

; Tracy profiler (0.13.1 viewer on this machine connects on demand).
bTracy = true

; Player contact probe (CharContactProbe): logs ccprobe lines on every contact-set change. Observes only.
bCharContactProbe = false
bRelayConditionTrace = false


[Character]
bGroundStates = true
bDynamicMover = true
bDebugHud = false
bCollisionHud = false
bLegCollision = true

; Jolt ground model (CharGroundModel): only real supporting contacts support; down-cast pull only right after walking off support.
bStrictSupport = false
bStickToFloorOnly = false

; Character controller spec step 1 (CharStateWrapper): wrapper states forward to vanilla and log.
bStateWrapper = true

; Character controller spec step 2 (CharFloorQuery): ray-footprint floor query, observe-only, logged against vanilla support.
bFloorQueryObserve = false
bPlanes = true
bStepQuery = true

; Floating hull (needs bGroundStates): the hull rides one step height above the feet and a spring carries the feet
; over stairs and drops; the step query and stick-to-floor stand down while it runs.
bPogo = true
bPredictorObserve = true

; Motion matching (needs the Motion Matching add-on and bPredictorObserve): the player plays the add-on's best-matching clip.
bMotionMatching = true

; Variable jump height (needs bGroundStates): 1 = heavier gravity after release, 2 = short / full hop.
bVariableJump = true

; Speed acceleration: any rise in movement speed reaches its target in fRampTime seconds.
bSpeedRamp = true
fRampTime = 0.4

; Facing through True Directional Movement: CB holds TDM's yaw control in its directional mode.
bFacing = true
bMovementModel = true

; Horse controller: the ridden horse runs the player's movement model (needs bCamera's mounted view), and every
; mountable race is built on the proxy character controller (read once at game start).
bHorseMovementModel = true
bHorseProxyController = false
bNpcController = true
bWeightedFacing = true
bPlayerTraction = true


[Camera]
bEnable = true
fPreferredDistance = 236
bManualZoom = false
bFirstPerson = false
fZoomHalflife = 0.12
iLockMode = 3
iMaxTargetsToBlend = 1
fLockBreakTime = 1
fFirstPersonHoldTime = 0.5
fFramingMaxDistance = 668
fLockRange = 2908
iLockKey = 0
iLockGamepadKey = 0x0
fFramingFullWeight = 500
fFramingZeroWeight = 1500


[Animation64]
bReaderWatch = false

; CB's own readers of the clip binding index read the 64-bit slot (CB's copies of the clip/offset/sync readers).
bReaders = true

; The clip loader + LoadClips' index stamp run from the 64-bit slot (AE only).
bLoader = true


[FootIk]
bEnable = false
bLegs = true
bBody = true
bTilt = false


[HavokRuntime]
bEnable = true


;BSSynchronizedClipGenerator=off
[JoltMirror]
bTripwire = 0
bEnable = 0
[GraphVariables]
; Each line sets a behavior graph variable by name (byte-exact), through the game's variable interface, in every graph
; that declares it: written when the graph starts and again when these settings change. A name no graph declares does
; nothing. Motion matching's search rules (the add-on's defaults shown):
;MM_SearchInterval = 0.1
;MM_MinDwell = 0.3
;MM_ForcedDwell = 0.1
;MM_SwitchFloor = 0.1
;MM_SwitchMargin = 0.12
;MM_IgnoreSurrounding = 10
;MM_ReselectTime = 0.3
;MM_BlendTimeGround = 0.2
;MM_BlendTimeLand = 0.2
;MM_BlendTimeJump = 0.15
;MM_BlendTimeAir = 0.2
;MM_BlendDecay = 0.1
