name:   boneorder
kind:   compatshim
# Every known skeleton's bone ORDER, keyed by the unit's Data-relative path as vanilla spells it: `animation` is
# skeletons[0] of its hkaAnimationContainer, `ragdoll` the skeleton its hkaRagdollInstance names (skeletons[1]).
# Each is a list of ordered LAYERS: vanilla's bones, then each skeleton mod's appended bones. A compatibility shim,
# not authored data: compiled behaviors (bone weight arrays, hkbBoneIndexArray, ragdoll modifiers' bone indices),
# animation bindings and skeleton mappers address bones by INDEX.
# Binding: the compiler takes the bones the serving skeleton actually has, in this order, and binds indices by
# name; a layer whose bones the skeleton lacks drops out, so vanilla alone reproduces vanilla's indices.
# Bones the shim does not list go after every known layer, in the source skeleton's own order.
# Bone names are exact (case and spacing included). Paths are matched by path identity.
# Not covered: the two Creation Club skeletons stored as tagfiles (bgssse001 fishing, giantcrab).
