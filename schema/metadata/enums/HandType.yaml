# What a hand holds, as the behavior variables iLeftHandType / iRightHandType carry it (and the setdata gates
# compare). Read from vanilla's animationsetdatasinglefile gates (1HMShield = left 10, CrossBow = 12, ...). Not a
# reflected Havok enum: nothing serializes it, so it only names gate values for a reader.
kind:  enum
name:  HandType
flags: false
items:
  - { name: HandToHandMelee , value: 0 }
  - { name: OneHandSword    , value: 1 }
  - { name: OneHandDagger   , value: 2 }
  - { name: OneHandAxe      , value: 3 }
  - { name: OneHandMace     , value: 4 }
  - { name: TwoHandSword    , value: 5 }
  - { name: TwoHandAxe      , value: 6 }
  - { name: Bow             , value: 7 }
  - { name: Staff           , value: 8 }
  - { name: Magic           , value: 9 }
  - { name: Shield          , value: 10 }
  - { name: Torch           , value: 11 }
  - { name: Crossbow        , value: 12 }
