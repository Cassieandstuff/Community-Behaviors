# Ported from HavokEnums.h (VariableType). Havok reflection enum -- item names/values are
# CASE-SENSITIVE and feed both .hky name rendering and the class signature CRC.
name:  VariableType
flags: false
items:
  - { name: VARIABLE_TYPE_INVALID    , value: -1 }
  - { name: VARIABLE_TYPE_BOOL       , value: 0 }
  - { name: VARIABLE_TYPE_INT8       , value: 1 }
  - { name: VARIABLE_TYPE_INT16      , value: 2 }
  - { name: VARIABLE_TYPE_INT32      , value: 3 }
  - { name: VARIABLE_TYPE_REAL       , value: 4 }
  - { name: VARIABLE_TYPE_POINTER    , value: 5 }
  - { name: VARIABLE_TYPE_VECTOR3    , value: 6 }
  - { name: VARIABLE_TYPE_VECTOR4    , value: 7 }
  - { name: VARIABLE_TYPE_QUATERNION , value: 8 }
