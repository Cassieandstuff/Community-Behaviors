name:      CBBlendSpace2DGenerator
parent:    hkbBlenderGenerator
size:      176
defaults:  { flags: FLAG_SYNC, indexOfSyncMasterChild: -1, maxCyclicBlendParameter: 1 }
runtime:
  source: self
# CB's own generator: a stock blender whose children sit on a plane (each child's `x`, `y`) and whose weights come from
# where blendX, blendY falls among them. Bind those two to variables. Everything but the weights is the blender's own:
# which children are active, sync, the pose. A child's `weight` is overwritten every update, and
# FLAG_PARAMETRIC_BLEND is cleared at activation, since it would read `weight` as a position.
# grid: children sharing an x form a row, the rows blend along x and each row along y, exactly as a blender of blenders
# does; FLAG_IS_PARAMETRIC_BLEND_CYCLIC with min/maxCyclicBlendParameter wraps x. Off: gradient bands over scattered samples.
# No `signature:` here on purpose: see CBPoseSearchGenerator.yaml.
fields:
  - { name: blendX, type: float }
  - { name: blendY, type: float }
  - { name: grid,   type: bool }
  - { skip: 7 }
