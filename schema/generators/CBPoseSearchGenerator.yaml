name:      CBPoseSearchGenerator
parent:    hkbGenerator
size:      128
view:      { kind: clipset, children: children, groups: databases, chooser: chooser }
runtime:
  source: self
# CB's own generator: motion matching as a node. Each update it reads its query from its graph's variables, searches its
# databases and plays the best frame, by writing what plays next to the variables `selectedIndex` and its children's
# user-controlled time are bound to; with no query it just follows `selectedIndex`. A stock
# hkbManualSelectorGenerator's indices are int8 (its last index is (int8)(children - 1)), so it holds 128 children at
# most; this one's are int32. The children are real hkbClipGenerators, as LoadClips and the root-motion walk require.
# Registered at startup by CB (platform/classes) from THIS descriptor: the members below are the hkClassMembers
# variable bindings resolve. No `signature:` here on purpose: the schema loader derives it from this descriptor and
# its parent chain, exactly as the engine hashes the registered class. The behavior loader recomputes it and refuses
# a file whose stored value differs, and the rest of the project's behaviors stop loading with it.
fields:
  - { name: children,      type: structarray, ref: CBPoseSearchChild, roster: slot }
  - { name: selectedIndex, type: int32 }
  - { name: currentIndex,  type: int32, ignored: true }
  - { name: databases,     type: structarray, ref: CBPoseSearchDatabase, roster: field:name }
  - { name: chooser,       type: ptr, ref: CBPoseSearchChooser }
  - { name: speed,         type: float }   # bind to the character's speed: the playback rate trims the playing frame to it
  - { pad: 8 }
# `databases` are the dance cards each child names, `chooser` picks which of them are searched.
# `children` is a slot roster because selectedIndex (MM_Clip) is a position. No member owns runtime memory: the arrays
# and the chooser are the loaded file's, each character's clone shares them, and the dead blend keeps its state per
# character.
