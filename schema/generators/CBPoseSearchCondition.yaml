# One column of a chooser row: a graph variable (named byte-exact) tested by `kind`:
#   0 = equals: the variable (int or enum) == intValue
#   1 = bool:   the variable (bool) == (intValue != 0)
#   2 = range:  minValue <= the variable (float) <= maxValue
fields:
  - { name: variable, type: string }
  - { name: kind,     type: int8 }
  - { pad: 4 }
  - { name: intValue, type: int32 }
  - { name: minValue, type: float }
  - { name: maxValue, type: float }
