name:      CBMovementAgent
parent:    CBBlueprintNode
size:      72
# One agent of a CBMovementMode: a unit of Skyrim's movement pipeline, created by name through the agent factory.
# Vanilla's configuration entry is {type, interface, init blob}; no agent's blob carries tunables, so an agent with no
# typed subclass yet is written as this base alone, and a typed subclass adds the agent's tunables as fields.
#   type       the agent's factory name, byte-exact (e.g. "PlayerControls", "Path Follower", "Angle Controller")
#   interface  the interface name the entry registers under, byte-exact (vanilla: "CurrentMovementState")
fields:
  - { name: type,      type: string }
  - { name: interface, type: string }
