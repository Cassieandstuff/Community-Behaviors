# The movement blueprint: what CB installs into Skyrim's per-actor movement pipeline at warm-up. Its `root` is a
# CBBlueprintChooser picking a CBMovementPool by process level (process level -> pool -> mode).
#   characterStates  a CBBlueprintChooser picking the actor's CBCharacterStateSet, evaluated once when the actor's
#                    character controller is created; choosing nothing leaves the actor on vanilla's states
