name:      CBCharacterStateSet
parent:    CBBlueprintNode
size:      72
# The character-controller states an actor runs: CB builds one hkpCharacterStateManager per set (states hold
# configuration only, so actors share it) and hands it to each actor the set is chosen for, when that actor's
# controller is created (the cinfo's state manager, set after vanilla fills the cinfo from the actor). An actor no set
# is chosen for keeps vanilla's shared manager. Vanilla's own set holds OnGround, Jumping, InAir, Climbing, Flying and
# Swimming at their vanilla ids.
#   states  the states, each filling the slot its `stateId` names (keyed by node; stateIds must not repeat within a set)
fields:
  - { name: states, type: ptrarray, ref: CBCharacterState, roster: ref }
