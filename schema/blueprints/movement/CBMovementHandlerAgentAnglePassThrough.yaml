name:      CBMovementHandlerAgentAnglePassThrough
parent:    CBMovementAgent
size:      80
# Vanilla MovementHandlerAgentAnglePassThrough, factory name "Angle Pass Through": turns the planner's desired pitch and
# yaw straight into the rates that reach them this update (the wrapped difference over dt), with no limits. It has no
# settings and leaves roll alone.
#   pitchRate  written: radians/s
#   turnRate   written: radians/s about the up axis
fields:
  - { name: pitchRate, type: float, role: { flags: [FLAG_OUTPUT] } }
  - { name: turnRate,  type: float, role: { flags: [FLAG_OUTPUT] } }
