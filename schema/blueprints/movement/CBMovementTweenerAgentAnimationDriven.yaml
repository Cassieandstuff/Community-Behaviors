name:      CBMovementTweenerAgentAnimationDriven
parent:    CBMovementAgent
size:      96
factory:   "Animation Driven"
# Vanilla MovementTweenerAgentAnimationDriven, factory name "Animation Driven": while active, the actor moves by its
# playing clips' root motion instead of the planned frame. Each update it samples the active clips' motion delta over
# dt (the adsf motion), scales it by the actor's scale, tilts it by the character controller's slope angle, and ends
# itself once no clip is still driving. On activate it sets the actor's animation-driven flag and clears it when it
# ends or deactivates. It has no settings and reads nothing at init.
#   translation  written: this update's root-motion translation, game units, actor frame
#   rotation     written: this update's root-motion rotation (pitch, roll, yaw), radians; vanilla builds a yaw-only
#                matrix when only yaw is nonzero
fields:
  - { name: translation, type: float, count: 3, role: { flags: [FLAG_OUTPUT] } }
  - { name: rotation,    type: float, count: 3, role: { flags: [FLAG_OUTPUT] } }
