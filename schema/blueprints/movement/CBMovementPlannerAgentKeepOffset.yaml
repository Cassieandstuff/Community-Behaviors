name:      CBMovementPlannerAgentKeepOffset
parent:    CBMovementAgent
size:      136
factory:   "Planner Keep Offset"
# Vanilla MovementPlannerAgentKeepOffset, factory name "Planner Keep Offset": plans toward a point held at an offset from
# a target actor (Papyrus KeepOffsetFromActor). It has no settings: its inputs are the five values the "Keep Offset
# From Actor" interface hands it, which the 1:1 blueprint binds to the keep-offset variables. Each update the point is
# the target's position plus `offset` turned and scaled by the target; the planned speed ramps from 0 at followRadius
# to full at catchUpRadius; the planned facing is the target's rotation plus `angleOffset`.
#   target         the target actor's handle (bound to the keep-offset target reference)
#   offset         the point's offset in the target's frame, game units
#   angleOffset    added to the target's rotation for the planned facing, radians
#   catchUpRadius  at or beyond this distance the planned speed is full
#   followRadius   at or within this distance the planned speed is 0
#   pitch, yaw     written: the planned direction, radians
#   speed          written: the planned speed, 0..3 (a share of the movement type's speeds; unit inferred)
#   facing         written: the planned facing (pitch, roll, yaw), radians
fields:
  - { name: target,        type: int32 }
  - { name: offset,        type: float, count: 3 }
  - { name: angleOffset,   type: float, count: 3 }
  - { name: catchUpRadius, type: float }
  - { name: followRadius,  type: float }
  - { name: pitch,         type: float, role: { flags: [FLAG_OUTPUT] } }
  - { name: yaw,           type: float, role: { flags: [FLAG_OUTPUT] } }
  - { name: speed,         type: float, role: { flags: [FLAG_OUTPUT] } }
  - { name: facing,        type: float, count: 3, role: { flags: [FLAG_OUTPUT] } }
  - { skip: 4 }
