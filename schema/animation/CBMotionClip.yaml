name:      CBMotionClip
parent:    null
size:      80
# One measured clip of the motion-matching cache, keyed by its animationName (byte-exact). `fingerprint` hashes the
# animation unit text it was measured from: a clip whose unit no longer hashes to it is measured again.
# `features` holds `frames` rows of featureDims floats; `rootPositions` the root's (x, y, z) per frame, game units.
fields:
  - { name: name,          type: string }
  - { name: fingerprint,   type: uint64 }
  - { name: frames,        type: int32 }
  - { name: frameDuration, type: float }
  - { name: duration,      type: float }
  - { pad: 8 }
  - { name: features,      type: scalararray, scalar: float }
  - { name: rootPositions, type: scalararray, scalar: float }
  - { name: curves,        type: structarray, ref: CBAnimationCurve, roster: field:name }
