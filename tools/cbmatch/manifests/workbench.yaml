# cbmatch manifest: the workbench — reimplemented functions still being matched (tools/cbmatch/workbench).
#   cbmatch tools/cbmatch/manifests/workbench.yaml --allow-variant --diff 256
#
# Informational: failures are expected here (tools/cbmatch/parked.yaml records why each is stuck). A function that
# passes graduates: its body moves into its schema/Havok unit, brought to the repo's conventions, and its line moves
# to manifests/schema.yaml, whose gate (--strict) holds only proven code. Workbench units include schema/Havok's
# headers; nothing in schema/ ever includes the workbench.
runtimes:
  ae: { exe: "${CB_SKYRIM_AE_EXE}", addresslib: "${CB_ADDRESSLIB_AE}", pins: ae }
registry: ../../../src/core/hooks/registry/engine.yaml
toolchains:
  vs2015: "${VS140COMNTOOLS}../../VC/bin/amd64/cl.exe"
  # Bethesda's engine code (and the Havok classes it compiled into its own units) is VS2017 15.9 (cl 19.16.27054);
  # every unit tries both and keeps the better result per function.
  vs2017: "C:/Program Files/Microsoft Visual Studio/18/Community/VC/Tools/MSVC/14.16.27023/bin/Hostx64/x64/cl.exe"
flags: [/O2, /Ob1, /GS-, /fp:fast]
includes: [../../../schema/Havok, "${VS140COMNTOOLS}../../VC/include"]
