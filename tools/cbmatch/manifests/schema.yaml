# cbmatch manifest: the schema tree's reimplemented Havok runtime (schema/Havok) against vanilla.
#   cbmatch tools/cbmatch/manifests/schema.yaml --allow-variant --diff 256 --strict
#
# Proven code only. --strict fails on any out-of-line definition a unit compiles that no line here covers: a function
# is either listed (and must pass) or a unit's declared driver (compiled only so the unit emits what it lists — a
# vtable, a header's inline copy; never matched, never in the image or the palette). Functions still being matched
# live in tools/cbmatch/workbench (manifests/workbench.yaml); units that are matching devices rather than Havok files
# live in tools/cbmatch/devices.
#
# One unit per translation unit: a TU boundary changes the code MSVC emits (what a caller may assume about a callee
# it can see), so units mirror the files vanilla was built from, not one per function.
#
# Machine-specific paths come from the environment:
#   CB_SKYRIM_AE_EXE   the unpacked SkyrimSE.exe (AE 1.6.1170)
#   CB_ADDRESSLIB_AE   its Address Library database (versionlib-1-6-1170-0.bin)
#   VS140COMNTOOLS     set by the VS2015 (v140) toolset install
runtimes:
  ae: { exe: "${CB_SKYRIM_AE_EXE}", addresslib: "${CB_ADDRESSLIB_AE}", pins: ae }
registry: ../../../src/core/hooks/registry/engine.yaml
toolchains:
  vs2015: "${VS140COMNTOOLS}../../VC/bin/amd64/cl.exe"
  # Bethesda's engine code (and the Havok classes it compiled into its own units) is VS2017 15.9 (cl 19.16.27054);
  # every unit tries both and keeps the better result per function.
  vs2017: "C:/Program Files/Microsoft Visual Studio/18/Community/VC/Tools/MSVC/14.16.27023/bin/Hostx64/x64/cl.exe"
# /Ob1: Havok's build inlines only `inline` functions — vanilla calls small same-file helpers that /Ob2 would inline.
flags: [/O2, /Ob1, /GS-, /fp:fast]
includes: [../../../schema/Havok, "${VS140COMNTOOLS}../../VC/include"]
# What there is to match: `cbmatch --inventory` regenerates the file from the exe; coverage prints after a full run.
# Physics: the character controller (hkpCharacter*, Bethesda's bhkChar*) is in scope; the rest of hkp* is a later pass (D4).
inventory:
  file: ../inventory.yaml
  parked: ../parked.yaml
  schema: ../../../schema
  include: ["hkb*", "hka*", "hkpCharacter*", "ahkpCharacter*", "bhkChar*", "hkCharControllerShape"]
  exclude: ["hkp*"]
  # Members reached only from out-of-scope code: Actor::Move drives the controller's per-frame update.
  roots:
    - { class: bhkCharacterController, va: 0x140e9f170 }   # UpdatePhysics
