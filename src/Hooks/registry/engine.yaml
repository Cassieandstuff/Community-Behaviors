# Engine symbol registry — every engine address CB touches that CommonLibSSE-NG does not already provide.
#
# The single hand-edited source: cmake/EmbedEngineRegistry.cmake bakes it into a generated header of
# constexpr symbols (a misspelled symbol is a compile error), resolved at runtime by <Hooks/registry/Registry.h>.
#
# Fields per symbol (one line each — the codegen parses this fixed shape):
#   name   C++ identifier (CB::core::hooks::engine::<name>)
#   kind   func | call | data
#            func = a function entry; call = a CALL rel32 INSIDE a function (written <id>+0x<offset>,
#            offsets differ per runtime); data = a global / string / static object.
#   se     Address Library ID for SE 1.5.97          (0 = no verified SE equivalent → unavailable on SE)
#   ae     Address Library ID for AE (1.6.1170 AND 1.7.104 — AE ids carry across AE versions; every entry
#          was verified in both builds: hash-identical, relocation-only, or benign same-function changes)
#   vr     Address Library ID for VR (0 = not yet verified → unavailable on VR). Never inferred from se:
#          CommonLib's 2-argument RelocationID silently reuses the SE id on VR; the registry always passes 3.
#
# Provenance: matched in Ghidra (RE-LAB, all three builds labeled) — vtable slot, unique string, call-graph
# position or global role; fuzzy hashes only proposed candidates. Cross-checked against CommonLib where they
# overlap (VTABLE_hkbClipGenerator 278766/226785, VTABLE_AnimationFileManagerSingleton 282545/232940 — agree).
# Struct offsets are NOT here: use CommonLib's RE types (RE::hkbClipGenerator, RE::BSSynchronizedClipGenerator,
# RE::Actor, …), which already carry per-runtime layouts. Vtables CommonLib exports (RE::VTABLE_*) are not
# duplicated either.

